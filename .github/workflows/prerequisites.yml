name: Prerequisites
on:
  workflow_call:
    inputs:
      is_pr:
        type: boolean
        required: true
      is_automated:
        type: boolean
        required: true
      default_branch:
        type: string
        required: true
    outputs:
      version:
        value: ${{ jobs.prerequisites.outputs.version }}

jobs:
  prerequisites:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      version: ${{ steps.provider-version.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@v1
        id: app-auth
        with:
          app-id: ${{ secrets.PULUMI_PROVIDER_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.PULUMI_PROVIDER_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: pulumi/provider-version-action@v1
        id: provider-version
        with:
          major-version: 1
          set-env: 'PROVIDER_VERSION'
      - run: echo "Version is ${{ steps.provider-version.outputs.version }}"
