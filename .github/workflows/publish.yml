# WARNING: This file is autogenerated - changes will be overwritten when regenerated by https://github.com/nellisauction/ci-mgmt
name: Publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      setLatestRelease:
        required: true
        type: boolean
      isPrerelease:
        required: true
        type: boolean

env:
  IS_PRERELEASE: ${{ inputs.isPrerelease }}
  TF_APPEND_USER_AGENT: pulumi

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false    
    - name: Create dist directory
      run: mkdir -p dist
    - name: Download provider assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: pulumi-resource-cockroachsql-v${{ inputs.version }}-*
        path: dist
        merge-multiple: true
    - name: Download schema
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: schema-embed.*
        merge-multiple: true
        path: dist
    - name: Calculate checksums
      working-directory: dist
      run: shasum ./*.tar.gz > "pulumi-cockroachsql_${{ inputs.version }}_checksums.txt"
    - name: Create GH Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
      with:
        tag_name: v${{ inputs.version }}
        prerelease: ${{ inputs.isPrerelease }}
        draft: ${{ inputs.isPrerelease }}
        make_latest: ${{ inputs.setLatestRelease }}
        generate_release_notes: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_sdk:
    name: publish_sdk
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Authenticate with Cloudsmith
        uses: cloudsmith-io/cloudsmith-cli-action@v2
        with:
          oidc-namespace: 'nellisauction'
          oidc-service-slug: 'github-actions'
      
      - name: Download Node.js SDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodejs-sdk.tar.gz
          path: sdk-nodejs
      
      - name: Download Python SDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdk.tar.gz
          path: sdk-python
          
      - name: Download Dotnet SDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-sdk.tar.gz
          path: sdk-dotnet

      - name: Unpack and Push Node.js SDK
        run: |
          mkdir -p nodejs-pkg
          tar -xzf sdk-nodejs/nodejs-sdk.tar.gz -C nodejs-pkg
          cloudsmith push npm nellisauction/pulumi-cockroachsql nodejs-pkg/bin/*.tgz
          
      - name: Unpack and Push Python SDK
        run: |
          mkdir -p python-pkg
          tar -xzf sdk-python/python-sdk.tar.gz -C python-pkg
          cloudsmith push python nellisauction/pulumi-cockroachsql python-pkg/bin/dist/*.whl
          cloudsmith push python nellisauction/pulumi-cockroachsql python-pkg/bin/dist/*.tar.gz
          
      - name: Unpack and Push Dotnet SDK
        run: |
          mkdir -p dotnet-pkg
          tar -xzf sdk-dotnet/dotnet-sdk.tar.gz -C dotnet-pkg
          cloudsmith push nuget nellisauction/pulumi-cockroachsql dotnet-pkg/bin/*.nupkg
